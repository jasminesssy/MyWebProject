<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buch — your library, catalogued</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#EDECDA;
    --sand-dark:#D9D4AF;
    --mint:#E1F9F4;
    --mint-dark:#BFE9E1;
    --raspberry:#F2619C;
    --raspberry-dark:#D8437F;
    --teal:#4FA79C;
    --teal-tint:#CDEEE8;
    --finished:#9C8F6A;
    --finished-tint:#E8E3CE;
    --ink:#2B2320;
    --ink-soft:#786C5D;
    --paper-shadow: rgba(43,35,32,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(43,35,32,.05) 1px, transparent 0) 0 0/22px 22px,
      var(--sand);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:0 0 80px;
  }

  ::selection{ background:var(--raspberry); color:var(--mint); }

  a, button, input, select, textarea{ font-family:inherit; }
  button{ cursor:pointer; }

  :focus-visible{
    outline: 3px solid var(--raspberry);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- layout shell ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }

  /* ---------- hero ---------- */
  .hero{
    padding: 56px 0 28px;
    border-bottom: 1px solid var(--sand-dark);
    margin-bottom: 8px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(48px,9vw,92px);
    margin:0;
    line-height:.95;
    letter-spacing:-.01em;
  }
  .wordmark .dot{ color:var(--raspberry); }
  .hero-sub{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .ribbon-rule{
    flex:1;
    min-width:80px;
    height:10px;
    background: repeating-linear-gradient(-45deg, var(--raspberry) 0 10px, var(--teal) 10px 20px);
    clip-path: polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);
    opacity:.85;
  }
  .hero-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .hero-count b{ color:var(--ink); }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    padding:22px 0;
  }
  .tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--sand-dark);
    background:transparent;
    color:var(--ink-soft);
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover{ border-color:var(--ink-soft); }
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--mint);
  }
  .tab .n{ opacity:.65; margin-left:5px; }

  .toolbar-right{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  .search{
    position:relative;
  }
  .search input{
    width:220px;
    padding:10px 14px 10px 34px;
    border-radius:20px;
    border:1px solid var(--sand-dark);
    background:#fff;
    font-size:13.5px;
    color:var(--ink);
  }
  .search input::placeholder{ color:var(--ink-soft); }
  .search svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; opacity:.55;
  }

  .btn-add{
    display:flex; align-items:center; gap:8px;
    background:var(--raspberry);
    color:#fff;
    border:none;
    padding:11px 18px 11px 14px;
    border-radius:20px;
    font-weight:600;
    font-size:14px;
    box-shadow: 0 3px 0 var(--raspberry-dark);
    transition: transform .1s;
  }
  .btn-add:hover{ transform:translateY(-1px); }
  .btn-add:active{ transform:translateY(1px); box-shadow:0 1px 0 var(--raspberry-dark); }

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:22px;
    padding-top:10px;
  }

  /* ---------- catalog card ---------- */
  .card{
    position:relative;
    background:var(--mint);
    border:1px solid var(--mint-dark);
    border-radius:6px 6px 14px 14px;
    padding:30px 20px 20px;
    box-shadow: 0 3px 0 var(--paper-shadow), 0 14px 24px -16px rgba(43,35,32,.35);
    cursor:pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .card:hover{
    transform: translateY(-3px) rotate(-.3deg);
    box-shadow: 0 5px 0 var(--paper-shadow), 0 20px 30px -16px rgba(43,35,32,.4);
  }
  .punch{
    position:absolute; top:10px;
    width:9px; height:9px; border-radius:50%;
    background:var(--sand);
    border:1.5px solid var(--mint-dark);
  }
  .punch.l{ left:16px; }
  .punch.r{ right:16px; }

  .status-tab{
    position:absolute;
    top:14px; right:-1px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:600;
    padding:5px 10px 5px 12px;
    border-radius:10px 0 0 10px;
    color:#fff;
  }
  .status-tab.reading{ background:var(--raspberry); }
  .status-tab.tbr{ background:var(--teal); }
  .status-tab.finished{ background:var(--finished); }

  .card-genre{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin:2px 0 8px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    line-height:1.15;
    margin:0 0 4px;
    padding-right:64px;
  }
  .card-author{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 16px;
  }

  .card-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .fmt-icon{ width:15px; height:15px; flex:none; }

  .progress-wrap{
    margin-top:14px;
  }
  .progress-label{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .progress-track{
    height:8px;
    border-radius:5px;
    background:#fff;
    border:1px solid var(--mint-dark);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--raspberry), var(--teal));
    border-radius:5px 0 0 5px;
  }

  .card-dates{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    border-top:1px dashed var(--mint-dark);
    padding-top:10px;
  }

  .finished-mark{
    position:absolute;
    bottom:16px; right:18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--finished);
    display:flex; align-items:center; gap:5px;
    text-transform:uppercase; letter-spacing:.08em;
    font-weight:600;
  }

  /* ---------- empty state ---------- */
  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty svg{ width:46px; height:46px; opacity:.4; margin-bottom:14px; }
  .empty h3{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:26px;
    color:var(--ink);
    margin:0 0 8px;
  }
  .empty p{ margin:0; font-size:14px; }

  /* ---------- overlay / form ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(43,35,32,.55);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .index-card-form{
    background:var(--mint);
    width:100%;
    max-width:480px;
    border-radius:8px;
    padding:30px 28px 26px;
    position:relative;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    background-image: repeating-linear-gradient(var(--mint) 0 37px, var(--mint-dark) 37px 38px);
    background-position: 0 78px;
  }
  .form-punch{
    position:absolute; top:14px;
    width:10px; height:10px; border-radius:50%;
    background:var(--sand); border:1.5px solid var(--mint-dark);
  }
  .form-punch.l{ left:20px; } .form-punch.r{ right:20px; }

  .form-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-align:center;
    margin:8px 0 20px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--ink-soft);
    padding:4px 2px 6px;
    font-size:15px;
    color:var(--ink);
    font-family:'Fraunces', serif;
  }
  .field select{ font-family:'Space Grotesk', sans-serif; font-size:14px; }
  .field input:focus, .field select:focus{
    outline:none;
    border-bottom-color:var(--raspberry);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  .form-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    gap:10px;
  }
  .btn-primary{
    background:var(--raspberry); color:#fff; border:none;
    padding:10px 20px; border-radius:20px; font-weight:600; font-size:14px;
    box-shadow:0 3px 0 var(--raspberry-dark);
  }
  .btn-primary:active{ transform:translateY(1px); box-shadow:0 1px 0 var(--raspberry-dark); }
  .btn-ghost{
    background:transparent; border:1px solid var(--ink-soft); color:var(--ink);
    padding:9px 16px; border-radius:20px; font-size:13.5px;
  }
  .btn-danger{
    background:transparent; border:none; color:var(--raspberry-dark);
    font-size:12.5px; font-family:'IBM Plex Mono', monospace;
    text-decoration:underline; padding:6px 0;
  }

  .close-x{
    position:absolute; top:14px; right:16px;
    background:none; border:none; font-size:20px; line-height:1;
    color:var(--ink-soft); padding:4px;
  }

  footer.credit{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:60px;
  }

  @media (max-width:520px){
    .row2{ grid-template-columns:1fr; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar-right{ justify-content:space-between; }
    .search input{ width:100%; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">a personal library, catalogued</p>
    <h1 class="wordmark">Buch<span class="dot">.</span></h1>
    <div class="hero-sub">
      <div class="ribbon-rule"></div>
      <div class="hero-count" id="hero-count">loading your shelves…</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar-right">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Search title or author…" />
      </div>
      <button class="btn-add" id="open-add">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add a book
      </button>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <h3 id="empty-title">Your shelves are empty</h3>
    <p id="empty-sub">Add your first book to start cataloguing.</p>
  </div>

  <footer class="credit">buch — every book gets a card</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="index-card-form" id="book-form">
    <div class="form-punch l"></div>
    <div class="form-punch r"></div>
    <button type="button" class="close-x" id="close-form">&times;</button>
    <p class="form-head" id="form-head">New catalog entry</p>

    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" required placeholder="The Name of the Wind" />
    </div>
    <div class="field">
      <label for="f-author">Author</label>
      <input id="f-author" required placeholder="Patrick Rothfuss" />
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-genre">Genre</label>
        <input id="f-genre" placeholder="Fantasy" />
      </div>
      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status">
          <option value="To Be Read">To Be Read</option>
          <option value="Reading">Reading</option>
          <option value="Finished">Finished</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-current">Current page</label>
        <input id="f-current" type="number" min="0" placeholder="0" />
      </div>
      <div class="field">
        <label for="f-total">Total pages <span style="opacity:.6">(optional)</span></label>
        <input id="f-total" type="number" min="0" placeholder="320" />
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-start">Start date</label>
        <input id="f-start" type="date" />
      </div>
      <div class="field">
        <label for="f-finish">Finish date</label>
        <input id="f-finish" type="date" />
      </div>
    </div>
    <div class="field">
      <label for="f-format">Reading format</label>
      <select id="f-format">
        <option value="Physical">Physical book</option>
        <option value="E-reader">E-reader</option>
        <option value="Audiobook">Audiobook</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-danger" id="delete-btn" hidden>Remove from catalog</button>
      <div style="display:flex; gap:10px; margin-left:auto;">
        <button type="button" class="btn-ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn-primary" id="save-btn">Save book</button>
      </div>
    </div>
  </form>
</div>

<script>
(function(){
  const STORAGE_KEY = 'books';
  let books = [];
  let activeTab = 'All';
  let searchTerm = '';
  let editingId = null;

  const gridEl = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  const tabsEl = document.getElementById('tabs');
  const heroCount = document.getElementById('hero-count');
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('book-form');
  const formHead = document.getElementById('form-head');
  const deleteBtn = document.getElementById('delete-btn');

  const icons = {
    Physical: '<svg class="fmt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    'E-reader': '<svg class="fmt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="18" x2="15" y2="18"/></svg>',
    Audiobook: '<svg class="fmt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>'
  };

  const statusClass = { 'Reading':'reading', 'To Be Read':'tbr', 'Finished':'finished' };
  const tabDefs = ['All','Reading','To Be Read','Finished'];

  function uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function loadBooks(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      books = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      books = [];
    }
    render();
  }

  async function saveBooks(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(books), false);
    }catch(e){
      console.error('Could not save your library right now.', e);
    }
  }

  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return '—';
    return dt.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function renderTabs(){
    tabsEl.innerHTML = tabDefs.map(t=>{
      const count = t==='All' ? books.length : books.filter(b=>b.status===t).length;
      const active = activeTab===t ? 'active' : '';
      return `<button class="tab ${active}" data-tab="${t}">${t}<span class="n">${count}</span></button>`;
    }).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; render(); });
    });
  }

  function renderCard(b){
    const cls = statusClass[b.status] || 'tbr';
    let progressHtml = '';
    if(b.status === 'Reading'){
      const cur = Number(b.currentPage)||0;
      const tot = Number(b.totalPages)||0;
      const pct = tot>0 ? Math.min(100, Math.round((cur/tot)*100)) : 0;
      progressHtml = `
        <div class="progress-wrap">
          <div class="progress-label"><span>pg. ${cur}${tot?'/'+tot:''}</span><span>${tot?pct+'%':''}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${tot?pct:8}%"></div></div>
        </div>`;
    }
    const finishedMark = b.status==='Finished'
      ? `<div class="finished-mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> finished</div>`
      : '';
    return `
      <article class="card" data-id="${b.id}">
        <span class="punch l"></span><span class="punch r"></span>
        <span class="status-tab ${cls}">${b.status}</span>
        <p class="card-genre">${b.genre ? b.genre : 'Uncategorized'}</p>
        <h3 class="card-title">${escapeHtml(b.title)}</h3>
        <p class="card-author">${escapeHtml(b.author)}</p>
        <div class="card-meta">${icons[b.format] || icons.Physical} ${b.format}</div>
        ${progressHtml}
        <div class="card-dates">
          <span>start&nbsp;${fmtDate(b.startDate)}</span>
          <span>finish&nbsp;${fmtDate(b.finishDate)}</span>
        </div>
        ${finishedMark}
      </article>`;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    renderTabs();
    heroCount.innerHTML = books.length
      ? `<b>${books.length}</b> book${books.length===1?'':'s'} catalogued · <b>${books.filter(b=>b.status==='Reading').length}</b> in progress`
      : `no books catalogued yet`;

    let visible = books;
    if(activeTab !== 'All') visible = visible.filter(b=>b.status===activeTab);
    if(searchTerm){
      const s = searchTerm.toLowerCase();
      visible = visible.filter(b => (b.title||'').toLowerCase().includes(s) || (b.author||'').toLowerCase().includes(s));
    }

    if(visible.length === 0){
      gridEl.hidden = true;
      emptyEl.hidden = false;
      const t = document.getElementById('empty-title');
      const sub = document.getElementById('empty-sub');
      if(books.length === 0){
        t.textContent = 'Your shelves are empty';
        sub.textContent = 'Add your first book to start cataloguing.';
      } else {
        t.textContent = 'No books match';
        sub.textContent = 'Try a different tab or search term.';
      }
    } else {
      gridEl.hidden = false;
      emptyEl.hidden = true;
      gridEl.innerHTML = visible.map(renderCard).join('');
      gridEl.querySelectorAll('.card').forEach(card=>{
        card.addEventListener('click', ()=> openForm(card.dataset.id));
      });
    }
  }

  function openForm(id){
    editingId = id || null;
    form.reset();
    if(id){
      const b = books.find(x=>x.id===id);
      formHead.textContent = 'Edit catalog entry';
      deleteBtn.hidden = false;
      document.getElementById('f-title').value = b.title||'';
      document.getElementById('f-author').value = b.author||'';
      document.getElementById('f-genre').value = b.genre||'';
      document.getElementById('f-status').value = b.status||'To Be Read';
      document.getElementById('f-current').value = b.currentPage||'';
      document.getElementById('f-total').value = b.totalPages||'';
      document.getElementById('f-start').value = b.startDate||'';
      document.getElementById('f-finish').value = b.finishDate||'';
      document.getElementById('f-format').value = b.format||'Physical';
    } else {
      formHead.textContent = 'New catalog entry';
      deleteBtn.hidden = true;
      document.getElementById('f-status').value = 'To Be Read';
      document.getElementById('f-format').value = 'Physical';
    }
    overlay.hidden = false;
    document.getElementById('f-title').focus();
  }

  function closeForm(){ overlay.hidden = true; editingId = null; }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = {
      title: document.getElementById('f-title').value.trim(),
      author: document.getElementById('f-author').value.trim(),
      genre: document.getElementById('f-genre').value.trim(),
      status: document.getElementById('f-status').value,
      currentPage: document.getElementById('f-current').value,
      totalPages: document.getElementById('f-total').value,
      startDate: document.getElementById('f-start').value,
      finishDate: document.getElementById('f-finish').value,
      format: document.getElementById('f-format').value
    };
    if(!data.title || !data.author) return;

    if(editingId){
      const idx = books.findIndex(b=>b.id===editingId);
      if(idx>-1) books[idx] = { ...books[idx], ...data };
    } else {
      books.unshift({ id: uid(), ...data });
    }
    await saveBooks();
    closeForm();
    render();
  });

  deleteBtn.addEventListener('click', async ()=>{
    if(!editingId) return;
    if(!confirm('Remove this book from your catalog?')) return;
    books = books.filter(b=>b.id!==editingId);
    await saveBooks();
    closeForm();
    render();
  });

  document.getElementById('open-add').addEventListener('click', ()=> openForm(null));
  document.getElementById('close-form').addEventListener('click', closeForm);
  document.getElementById('cancel-btn').addEventListener('click', closeForm);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeForm(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && !overlay.hidden) closeForm(); });

  document.getElementById('search').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
  });

  loadBooks();
})();
</script>
</body>
</html>
